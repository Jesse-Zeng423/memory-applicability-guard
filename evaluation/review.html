<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:; base-uri 'none'; form-action 'none'"
    />
    <title>记忆审核 · 一步一步判断</title>
    <style>
      :root {
        font-family:
          "PingFang SC", "Microsoft YaHei", "Avenir Next", sans-serif;
        color: #18343c;
        background: #edf3f3;
        line-height: 1.65;
        --ink: #18343c;
        --muted: #567078;
        --line: #cbdcde;
        --accent: #086b75;
        --paper: #fff;
        --gold: #9a6614;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        background: white;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 9px 15px;
      }
      button:hover {
        background: #e7f2f2;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.text {
        border: 0;
        background: transparent;
        padding: 6px;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 3px solid #ca921e;
        outline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      .top {
        background: #fff;
        border-bottom: 1px solid var(--line);
        padding: 18px max(24px, calc((100vw - 1320px) / 2));
        display: flex;
        gap: 18px;
        align-items: center;
        flex-wrap: wrap;
      }
      .brand {
        flex: 1;
        min-width: 190px;
      }
      h1 {
        font-size: 22px;
        margin: 0;
        font-weight: 650;
        letter-spacing: 0.02em;
      }
      .subtitle {
        font-size: 13px;
        color: var(--muted);
        margin: 2px 0 0;
      }
      .tools {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .tools button {
        font-size: 13px;
      }
      .casebar {
        max-width: 1320px;
        margin: 0 auto;
        padding: 16px 24px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .casebar strong {
        font-size: 17px;
        margin-right: auto;
      }
      .chip {
        font-size: 12px;
        color: #086b75;
        background: #deeeee;
        border-radius: 4px;
        padding: 3px 8px;
      }
      .proposal {
        max-width: 1272px;
        margin: 0 auto 16px;
        padding: 12px 18px;
        background: #fff7e4;
        border-left: 3px solid #c08b29;
        font-size: 14px;
      }
      .message {
        max-width: 1272px;
        margin: 0 auto;
        white-space: pre-wrap;
        font-size: 14px;
        color: var(--accent);
      }
      .message.error {
        color: #8b302c;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(290px, 0.78fr) minmax(0, 1.4fr);
        gap: 26px;
        max-width: 1320px;
        padding: 0 24px 30px;
        margin: auto;
        align-items: start;
      }
      .source {
        background: #fff;
        border: 1px solid var(--line);
        padding: 24px;
        position: sticky;
        top: 16px;
      }
      .source h2 {
        font-size: 14px;
        color: var(--muted);
        font-weight: 500;
        margin: 0 0 9px;
      }
      .source blockquote {
        margin: 0;
        font-size: 21px;
        line-height: 1.65;
        font-weight: 600;
      }
      .memory {
        border-left: 4px solid var(--accent);
        padding: 17px 18px;
        margin: 22px -1px;
        background: #edf7f7;
      }
      .memory h2 {
        color: var(--accent);
      }
      .memory blockquote {
        font-size: 19px;
        font-weight: 550;
      }
      .date {
        font-size: 12px;
        color: var(--muted);
      }
      .source h3 {
        font-size: 15px;
        font-weight: 600;
        margin: 22px 0 10px;
      }
      .source p {
        margin: 5px 0;
      }
      .record {
        border-top: 1px solid var(--line);
        padding: 12px 0;
      }
      .record .meta {
        font-size: 12px;
        color: var(--muted);
      }
      .record .quote {
        font-size: 14px;
        white-space: pre-wrap;
      }
      .technical {
        font-size: 12px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .technical pre {
        white-space: pre-wrap;
        font:
          11px/1.6 ui-monospace,
          monospace;
      }
      .record details {
        margin-top: 6px;
      }
      .source details summary {
        cursor: pointer;
        font-size: 12px;
        color: var(--muted);
      }
      .actionlist {
        padding-left: 20px;
        font-size: 14px;
      }
      .journey {
        min-width: 0;
      }
      .steps {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 16px;
      }
      .steps button {
        padding: 7px 10px;
        font-size: 12px;
        border-radius: 4px;
        background: transparent;
        color: var(--muted);
      }
      .steps button.active {
        background: var(--ink);
        border-color: var(--ink);
        color: white;
      }
      .steps button.done {
        border-bottom: 3px solid var(--accent);
      }
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        padding: 28px 30px;
        min-height: 420px;
      }
      .stepcount {
        font-size: 13px;
        color: var(--accent);
        margin: 0;
      }
      .panel h2 {
        font-size: 25px;
        line-height: 1.45;
        margin: 8px 0 10px;
        font-weight: 650;
      }
      .hint {
        font-size: 14px;
        color: var(--muted);
        margin: 0 0 22px;
        max-width: 65ch;
      }
      .choices {
        display: grid;
        gap: 11px;
      }
      .choice {
        display: grid;
        grid-template-columns: 20px 1fr;
        gap: 12px;
        border: 1px solid var(--line);
        padding: 14px 16px;
        cursor: pointer;
        border-radius: 6px;
        align-items: start;
      }
      .choice:has(input:checked) {
        background: #edf8f8;
        border-color: var(--accent);
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .choice input {
        margin-top: 7px;
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
      }
      .choice strong {
        font-size: 16px;
        font-weight: 600;
        display: block;
      }
      .choice .explain {
        font-size: 13px;
        color: var(--muted);
        display: block;
        margin-top: 3px;
      }
      .choice .code {
        font:
          11px ui-monospace,
          monospace;
        color: var(--muted);
        display: block;
        margin-top: 5px;
      }
      .fieldlabel {
        font-size: 14px;
        display: block;
        margin: 16px 0 6px;
      }
      .wideinput {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 10px 12px;
        background: white;
      }
      .panel textarea {
        min-height: 100px;
        resize: vertical;
      }
      .navigation {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 24px;
      }
      .small {
        font-size: 12px;
        color: var(--muted);
      }
      .summary {
        margin-top: 18px;
        padding: 19px 23px;
        background: #dfeeee;
        border-left: 4px solid var(--accent);
      }
      .summary h3 {
        font-size: 13px;
        color: var(--muted);
        margin: 0 0 6px;
        font-weight: 500;
      }
      .summary strong {
        font-size: 20px;
      }
      .summary p {
        font-size: 14px;
        margin: 7px 0 0;
      }
      .summary ul {
        padding-left: 20px;
        font-size: 13px;
      }
      .summary a {
        color: inherit;
      }
      .evidencecard {
        padding: 15px 0;
        border-bottom: 1px solid var(--line);
      }
      .evidencecard .quote {
        white-space: pre-wrap;
        font-size: 14px;
      }
      .evidencecard .meta {
        font-size: 12px;
        color: var(--muted);
      }
      .evidencecard select {
        max-width: 100%;
        width: 100%;
        padding: 9px;
        border: 1px solid var(--line);
        background: white;
        border-radius: 5px;
        font-size: 13px;
      }
      .decisive {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        font-size: 13px;
        margin-top: 11px;
      }
      .decisive input {
        margin-top: 5px;
        width: 17px;
        height: 17px;
        accent-color: var(--accent);
      }
      .step-summary {
        list-style: none;
        padding: 0;
        margin: 16px 0;
      }
      .step-summary li {
        border-top: 1px solid var(--line);
        display: flex;
        gap: 12px;
        justify-content: space-between;
        font-size: 14px;
        padding: 11px 0;
      }
      .step-summary .text {
        color: var(--muted);
      }
      .reviewfoot {
        border-top: 1px solid var(--line);
        padding-top: 18px;
        margin-top: 20px;
      }
      .reviewfoot .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .reviewfoot input {
        flex: 1;
        min-width: 150px;
      }
      .boundary {
        max-width: 1320px;
        margin: auto;
        padding: 0 24px 25px;
        font-size: 12px;
        color: var(--muted);
      }
      .originalnotes {
        margin: 18px 0;
      }
      .originalnotes summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 13px;
      }
      .originalnotes textarea {
        margin-top: 10px;
      }
      .statusline {
        font-size: 13px;
        color: var(--accent);
        margin: 10px 0 0;
      }
      @media (max-width: 900px) {
        .workspace {
          grid-template-columns: 1fr;
        }
        .source {
          position: static;
        }
        .panel {
          padding: 22px;
        }
        .source blockquote {
          font-size: 19px;
        }
        .top {
          padding: 16px 20px;
        }
        .casebar {
          padding: 14px 20px;
        }
        .workspace {
          padding: 0 20px 24px;
        }
        .proposal,
        .message {
          margin-left: 20px;
          margin-right: 20px;
        }
        .steps button {
          font-size: 11px;
        }
        .panel h2 {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <h1 id="page-title"></h1>
        <p id="subtitle" class="subtitle"></p>
      </div>
      <div class="tools">
        <button id="language"></button><button id="codes"></button
        ><button id="import"></button><button id="export"></button
        ><input id="file" type="file" accept=".json,application/json" hidden />
      </div>
    </header>
    <div class="casebar">
      <strong id="progress" aria-live="polite"></strong
      ><span class="chip" id="review-status"></span><button id="prev"></button
      ><button id="next"></button>
    </div>
    <div id="proposal-notice" class="proposal" hidden></div>
    <p id="message" class="message" role="status"></p>
    <main class="workspace">
      <aside class="source" aria-label="案例与记忆">
        <h2 id="task-label"></h2>
        <blockquote id="query"></blockquote>
        <p id="date" class="date"></p>
        <div class="memory">
          <h2 id="memory-label"></h2>
          <blockquote id="candidate"></blockquote>
          <p id="memory-date" class="date"></p>
        </div>
        <h3 id="history-label"></h3>
        <div id="history"></div>
        <details>
          <summary id="boundary-label"></summary>
          <div id="boundaries"></div>
        </details>
        <h3 id="actions-label"></h3>
        <ul id="actions" class="actionlist"></ul>
        <details>
          <summary id="metadata-label"></summary>
          <div id="metadata" class="technical"></div>
        </details>
      </aside>
      <section class="journey">
        <nav id="steps" class="steps" aria-label="判断步骤"></nav>
        <section id="panel" class="panel"></section>
        <section class="summary" aria-live="polite">
          <h3 id="decision-label"></h3>
          <strong id="decision"></strong>
          <p id="decision-explain"></p>
          <p id="decision-state" class="small"></p>
        </section>
      </section>
    </main>
    <p id="boundary" class="boundary"></p>
    <script>
      "use strict";
      const DATA = __REVIEW_DATA__;
      __REVIEW_LOGIC__;
    </script>
  </body>
</html>
